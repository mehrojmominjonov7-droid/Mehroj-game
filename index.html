<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Stikman Party Online</title>
<style>
body{margin:0;background:#14161c;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px}
canvas{width:min(100%,900px);aspect-ratio:16/9;border-radius:12px;touch-action:none;display:block}
button,input{font:inherit;padding:10px 14px;border-radius:10px;border:0}
button{background:#e63946;color:#fff;cursor:pointer}input{background:#222632;color:#fff;width:130px}
#lb{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}p{margin:0;font-size:14px;opacity:.8}
</style></head><body>
<h2 style="margin:0">🥊 Stikman Party Online</h2>
<canvas id="c" width="800" height="450"></canvas>
<div id="lb">
 <div class="row" id="jn"><input id="nm" placeholder="Ismingiz" maxlength="12"><input id="rc" placeholder="Xona kodi" maxlength="8"><button id="go">Kirish / Xona ochish</button></div>
 <div id="pl"></div>
 <div class="row"><button id="st" hidden>▶ Boshlash</button><button id="cp" hidden>🔗 Havolani nusxalash</button></div>
 <p id="info">Ismingizni yozing. Xona kodini bo'sh qoldirsangiz yangi xona ochiladi.</p>
</div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),W=800,H=450;
const DUR={tap:10,run:20,catch:20,react:9},NAMES={tap:'Tez bos!',run:'Sakrash poygasi',catch:'Mevalar',react:'Reaksiya'};
let me,room,ps=[],host,G=null,P={},keys={},res=null,tap=0,ptr=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt()+';');
const q=new URLSearchParams(location.search);
$('rc').value=(q.get('room')||'').toUpperCase();$('nm').value=localStorage.nm||'';
function send(t,x){fetch('/send',{method:'POST',body:JSON.stringify({room,id:me,t,...x}),keepalive:true})}
$('go').onclick=()=>{
 const name=$('nm').value.trim()||'Stikman';localStorage.nm=name;
 const rc=($('rc').value.trim()||Math.random().toString(36).slice(2,6)).toUpperCase();
 const es=new EventSource('/events?room='+rc+'&name='+encodeURIComponent(name));
 es.onmessage=e=>on(JSON.parse(e.data));
 es.onerror=()=>{$('info').textContent="Aloqa uzildi yoki xona to'la. Sahifani yangilang."};
 $('jn').hidden=true;
};
$('st').onclick=()=>send('start');
$('cp').onclick=()=>{navigator.clipboard.writeText(location.href);$('cp').textContent='✅ Nusxalandi'};
function ui(){
 $('pl').innerHTML=ps.map(p=>`<b style="color:${p.color}">● ${esc(p.name)}</b> (${p.pts})`).join(' &nbsp; ');
 $('st').hidden=!(host==me&&(!G||G.over));$('cp').hidden=false;
 $('info').textContent=host==me?"Havolani do'stlarga yuboring, hammasi kirgach Boshlash ni bosing (2–4 kishi).":"Xona egasi boshlashini kuting...";
}
function on(m){
 if(m.t=='hello'){me=m.id;room=m.room;history.replaceState(0,'','?room='+m.room)}
 else if(m.t=='lobby'){ps=m.ps;host=m.host;ui()}
 else if(m.t=='start'){
  G={game:m.game,seed:m.seed,t0:performance.now()+m.delay,dur:DUR[m.game],over:0,sent:0,round:m.round,rounds:m.rounds};
  res=null;init();ui();
 }
 else if(m.t=='state'){if(P[m.id])Object.assign(P[m.id],m.s)}
 else if(m.t=='result'){if(G)G.over=1;res=m;ui()}
}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function init(){
 const r=rng(G.seed);P={};
 for(const p of ps)P[p.id]={n:0,y:0,d:0,st:0,x:50,s:0,rt:null};
 G.L=P[me];G.vy=0;G.h={};
 if(G.game=='run'){G.ob=[];for(let t=2;t<G.dur-1;t+=.9+r()*1.1)G.ob.push(t)}
 if(G.game=='catch'){G.it=[];for(let t=1;t<G.dur-1;t+=.55)G.it.push({t,x:r(),bad:r()<.2,c:0})}
 if(G.game=='react')G.go=2+r()*4;
}
addEventListener('keydown',e=>{keys[e.code]=1;if((e.code=='Space'||e.code=='ArrowUp')&&!e.repeat)tap++;if(e.code=='Space'||e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
const pf=e=>{const b=cv.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-b.left)/b.width))};
cv.addEventListener('pointerdown',e=>{tap++;ptr=pf(e)});
cv.addEventListener('pointermove',e=>{if(ptr!=null)ptr=pf(e)});
addEventListener('pointerup',()=>ptr=null);
function sim(t,dt){
 const L=G.L,gm=G.game;
 if(gm=='tap'){L.n+=tap}
 if(gm=='run'){
  if(tap&&L.y==0&&L.st<=0)G.vy=520;
  L.y+=G.vy*dt;G.vy-=1500*dt;if(L.y<=0){L.y=0;G.vy=0}
  if(L.st>0)L.st-=dt;else L.d+=30*dt;
  G.ob.forEach((o,i)=>{if(!G.h[i]&&Math.abs(o-t)<.08&&L.y<28){G.h[i]=1;L.st=.6;L.d=Math.max(0,L.d-6)}});
 }
 if(gm=='catch'){
  const LW=W/ps.length,dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  L.x+=dx*420*dt;if(ptr!=null)L.x=ptr*LW;L.x=Math.max(24,Math.min(LW-24,L.x));
  for(const it of G.it){const y=(t-it.t)*200;
   if(!it.c&&y>H-80&&y<H-10&&Math.abs(it.x*(LW-60)+30-L.x)<30){it.c=1;L.s+=it.bad?-2:1}}
 }
 if(gm=='react'&&L.rt==null){
  if(tap)L.rt=t<G.go?9999:Math.round((t-G.go)*1000);
  else if(t>G.go+3)L.rt=9999;
 }
 tap=0;
}
const mine=()=>{const L=G.L;return{n:L.n,y:L.y,d:L.d,st:L.st,x:L.x,s:L.s,rt:L.rt}};
const score=()=>{const L=G.L;return{tap:L.n,run:Math.floor(L.d),catch:L.s,react:L.rt??9999}[G.game]};
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(G&&!G.over){
  const t=(now-G.t0)/1000;
  if(t>=0&&!G.sent)sim(t,dt);else tap=0;
  if(!G.sent&&(t>=G.dur||(G.game=='react'&&G.L.rt!=null))){G.sent=1;send('done',{score:score()})}
  if(now-(G.ls||0)>66){G.ls=now;send('state',{s:mine()})}
 }
 draw(now);requestAnimationFrame(loop);
}
function txt(s,x,y,z,c,a){g.font='bold '+z+'px system-ui';g.fillStyle=c||'#222';g.textAlign=a||'center';g.fillText(s,x,y)}
function man(x,y,c,sc,ph,air){
 g.save();g.translate(x,y);g.scale(sc,sc);g.strokeStyle=g.fillStyle=c;g.lineWidth=5;g.lineCap='round';
 const s=air?4:Math.sin(ph)*9;
 g.beginPath();g.arc(0,-52,9,0,7);g.fill();g.beginPath();
 g.moveTo(0,-43);g.lineTo(0,-22);g.moveTo(0,-22);g.lineTo(s,0);g.moveTo(0,-22);g.lineTo(-s,0);
 g.moveTo(0,-38);g.lineTo(air?16:10,air?-36:-26);g.moveTo(0,-38);g.lineTo(-10,-26);g.stroke();g.restore();
}
const fmt=s=>G.game=='react'?(s>=9999?'xato':s+' ms'):s;
function draw(now){
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#bfe0ff');gr.addColorStop(1,'#f4e9d8');g.fillStyle=gr;g.fillRect(0,0,W,H);
 if(!G){txt("Xonaga kiring va do'stlaringizni kuting",W/2,H/2,26);return}
 const n=ps.length,t=(now-G.t0)/1000,gm=G.game,LH=H/n,LW=W/n;
 if(gm=='react'){const c=t<G.go?'#e63946':'#2dc653';g.fillStyle=t<0?'#6c757d':c;g.fillRect(0,0,W,H)}
 ps.forEach((p,i)=>{
  const s=P[p.id];if(!s)return;
  if(gm=='tap'){const y=LH*(i+1)-20,x=60+Math.min(1,s.n/60)*640;
   g.fillStyle='#3b3f4a';g.fillRect(40,y,700,4);g.fillStyle='#ffb703';g.fillRect(700,y-40,5,40);
   man(x,y,p.color,Math.min(1,LH/110),now/90);txt(p.name+' · '+s.n,60,y-Math.min(60,LH-30),16,'#222','left')}
  if(gm=='run'){const gy=LH*(i+1)-14,sc=Math.min(1,LH/140);
   g.fillStyle='#3b3f4a';g.fillRect(0,gy,W,5);g.fillStyle='#8d4b2a';
   if(G.ob)for(const o of G.ob){const X=150+(o-t)*300;if(X>-20&&X<W+20)g.fillRect(X-12,gy-26*sc,24,26*sc)}
   man(150,gy-s.y*sc,p.color,sc,now/70,s.y>0);if(s.st>0){g.globalAlpha=.4;g.fillStyle='#e63946';g.fillRect(120,gy-60*sc,60,60*sc);g.globalAlpha=1}
   txt(p.name+' · '+Math.floor(s.d)+' m',10,gy-Math.min(75,LH-25),16,'#222','left')}
  if(gm=='catch'){const x0=i*LW;g.fillStyle=i%2?'#0001':'#fff3';g.fillRect(x0,0,LW,H);
   g.font='24px system-ui';g.textAlign='center';
   for(const it of G.it){const y=(t-it.t)*200;if(y>0&&y<H&&!(it.c&&p.id==me))g.fillText(it.bad?'💣':'🍎',x0+it.x*(LW-60)+30,y)}
   man(x0+s.x,H-10,p.color,1,now/90,0);txt(p.name+' · '+s.s,x0+LW/2,24,16)}
  if(gm=='react'){man(LW*i+LW/2,H-30,p.color,1,0,0);txt(p.name,LW*i+LW/2,H-110,16,'#fff');
   if(s.rt!=null)txt(s.rt>=9999?'xato':s.rt+' ms',LW*i+LW/2,H-135,22,'#fff')}
 });
 if(gm=='react')txt(t<0?'Tayyor bo\'ling...':t<G.go?'KUT...':'BOS!!!',W/2,H/2-30,t<G.go?48:80,'#fff');
 if(!G.over){
  txt(G.round+'/'+G.rounds+' · '+NAMES[gm],W/2,22,16,gm=='react'?'#fff':'#222');
  if(t>=0)txt(Math.max(0,Math.ceil(G.dur-t))+' s',W-12,22,16,gm=='react'?'#fff':'#222','right');
  else txt(Math.ceil(-t),W/2,H/2,100,'#e63946');
 }
 if(res&&G.over){
  g.fillStyle='#000b';g.fillRect(100,40,600,370);
  txt(res.last?'🏆 YAKUNIY NATIJA':'Raund natijasi',W/2,90,28,'#fff');
  res.list.forEach((r,i)=>txt((i+1)+'. '+r.name+'  '+fmt(r.s)+'   Jami: '+r.pts,W/2,150+i*52,24,'#fff'));
 }
}
requestAnimationFrame(loop);
</script></body></html>
